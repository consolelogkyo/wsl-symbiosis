[package]
name = "wsl-symbiosis"
version = "0.1.3"
description = "Simbiose visual entre Windows e WSL2"
authors = ["WSL Symbiosis"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "wsl_symbiosis_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
# preserve_order: the Windows Terminal settings.json is rewritten keeping the user's key order.
serde_json = { version = "1", features = ["preserve_order"] }
tokio = { version = "1", features = ["process", "time", "sync", "macros", "io-util", "rt"] }
sysinfo = { version = "0.39.6", default-features = false, features = ["system"] }
portable-pty = "0.9.0"
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"

[target.'cfg(windows)'.dependencies]
# NtQuerySystemInformation: reads the protected vmmemWSL process without OpenProcess.
ntapi = "0.4"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
